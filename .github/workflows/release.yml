name: Release

# Push a tag like v0.2.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal) and run engine tests
        run: scripts/build.sh --no-install

      - name: Package installer and zip
        run: scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "scqwatcha ${TAG#v}" --notes-file packaging/RELEASE_NOTES.md
          fi
